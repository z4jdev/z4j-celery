[project]
name = "z4j-celery"
version = "1.6.7"
description = "z4j Celery queue engine adapter (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "celery", "task", "queue"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Celery",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floors bumped to >=1.1.0 for the v1.1.0 ecosystem family
    # release. z4j-bare 1.1.0 fixes the schedule.fire dispatcher
    # path: pre-1.1 the agent rejected every brain-side scheduler
    # tick before the celery engine ever saw it, so this adapter
    # was effectively unreachable from the new scheduler service.
    "z4j-core>=1.4.0,<2",
    "z4j-bare>=1.4.0,<2",
    # Celery compatibility policy (operator-chosen primary, wide range):
    # every Celery API z4j-celery touches (signals, control commands,
    # app.conf lowercase keys, AsyncResult, connection_for_read/write,
    # events.Receiver) has been stable since Celery 5.0. 5.2 is the
    # practical lower bound of actively maintained Celery in 2026 and
    # catches the dominant Celery 5.3 LTS-era operator base; 5.6.3
    # (the previous floor) excluded entire LTS install populations
    # for no functional reason. Per z4j supply-chain policy, the
    # operator owns the Celery security posture; we adapt to whatever
    # they run.
    "celery>=5.2",
]

[project.scripts]
# 1.1.2+ console script. Both ``z4j-celery`` (pip-installed entry
# point) and ``python -m z4j_celery`` (module form) work and
# dispatch to the same code path. Engine adapters are libraries,
# so the CLI is doctor / check / status / version only - no
# ``run`` or ``restart`` (those belong to framework adapters).
z4j-celery = "z4j_celery.cli:main"

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-celery/blob/main/CHANGELOG.md"
Documentation = "https://z4j.dev"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-celery/issues"
Source = "https://github.com/z4jdev/z4j-celery"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_celery"]
